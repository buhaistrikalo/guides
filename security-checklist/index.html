<script>
const sections = [
  {
    num: "01",
    title: "Секреты и конфиг",
    items: [
      { text: "Захардкоженные секреты, токены или API-ключи в коде", severity: "critical" },
      { text: "Секреты утекают через логи, ошибки или ответы API", severity: "critical" },
      { text: ".env файлы закоммичены в git", severity: "critical" },
      { text: "API-ключи торчат на клиенте, хотя должны быть только на сервере", severity: "critical" },
      { text: "CORS настроен слишком широко — разрешено всё подряд", severity: "high" },
      { text: "Зависимости с известными уязвимостями", severity: "high" },
      { text: "Дефолтные пароли или примеры конфигов в проде", severity: "critical" },
      { text: "Debug-режим или dev-тулзы включены в продакшене", severity: "high" },
    ]
  },
  {
    num: "02",
    title: "Доступ и API",
    items: [
      { text: "Страницы или роуты доступны без авторизации", severity: "critical" },
      { text: "Можно получить чужие данные, подменив ID в URL", severity: "critical" },
      { text: "Токены хранятся на клиенте в открытом виде", severity: "critical" },
      { text: "Логин или сброс пароля показывает, существует ли аккаунт", severity: "medium" },
      { text: "Нет rate limiting на эндпоинтах", severity: "high" },
      { text: "Ошибки возвращают внутренние детали (стектрейсы, SQL)", severity: "high" },
      { text: "API отдаёт больше данных, чем нужно клиенту", severity: "high" },
      { text: "Удаление, смена email и другие критичные действия — без подтверждения", severity: "high" },
      { text: "Админка защищена только скрытым URL", severity: "critical" },
    ]
  },
  {
    num: "03",
    title: "Пользовательский ввод",
    items: [
      { text: "Пользовательский ввод попадает в SQL без санитизации", severity: "critical" },
      { text: "Пользовательский текст может выполнить код в браузерах других юзеров (XSS)", severity: "critical" },
      { text: "Загрузка файлов без проверки типа и размера", severity: "high" },
      { text: "Логику оплаты или биллинга можно обойти на клиенте", severity: "critical" },
    ]
  },
  {
    num: "04",
    title: "Инфраструктура",
    items: [
      { text: "Нет HTTPS — трафик летает в открытом виде", severity: "critical" },
      { text: "Нет бэкапов базы данных", severity: "high" },
      { text: "SSH доступен по паролю, а не по ключу", severity: "high" },
      { text: "Docker-контейнеры бегают от root", severity: "medium" },
      { text: "Порты БД или Redis торчат наружу", severity: "critical" },
      { text: "Нет мониторинга — узнаёшь о проблемах от юзеров", severity: "medium" },
    ]
  },
  {
    num: "05",
    title: "AI-специфика",
    items: [
      { text: "AI нагенерил TODO/FIXME — и ты их не проверил", severity: "medium" },
      { text: "Код из чата вставлен без ревью — «работает и ладно»", severity: "high" },
      { text: "AI добавил пакеты, которые ты не проверил (supply chain)", severity: "high" },
      { text: "Промпты с пользовательским вводом без экранирования (prompt injection)", severity: "critical" },
    ]
  },
];

const STORAGE_KEY = 'vibe-security-checklist';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function render() {
  const state = loadState();
  const app = document.getElementById('app');
  let totalItems = 0;
  let checkedItems = 0;
  let html = '';

  sections.forEach((section, si) => {
    const sectionChecked = section.items.filter((_, ii) => state[`${si}-${ii}`]).length;
    html += `<div class="section">
      <div class="section-header">
        <span class="section-num">${section.num}</span>
        <span class="section-title">${section.title}</span>
        <span class="section-count">${sectionChecked}/${section.items.length}</span>
      </div>
      <div class="checklist">`;

    section.items.forEach((item, ii) => {
      const key = `${si}-${ii}`;
      const checked = state[key];
      if (checked) checkedItems++;
      totalItems++;
      html += `<div class="item ${checked ? 'checked' : ''}" data-key="${key}">
        <div class="checkbox">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6.5L4.5 9L10 3" stroke="#0c0c0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="item-text">${item.text}</span>
        <div class="severity-dot severity-${item.severity}"></div>
      </div>`;
    });

    html += `</div></div>`;
  });

  app.innerHTML = html;

  const pct = totalItems ? Math.round((checkedItems / totalItems) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${checkedItems}/${totalItems}`;

  document.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.key;
      const s = loadState();
      s[key] = !s[key];
      saveState(s);
      render();
    });
  });
}

document.getElementById('resetBtn').addEventListener('click', () => {
  localStorage.removeItem(STORAGE_KEY);
  render();
});

render();
</script>
