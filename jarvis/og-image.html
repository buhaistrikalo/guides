<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>OG Image — Собери своего Джарвиса с Claude</title>
    <style>
        * { box-sizing: border-box; }

        html,
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
            overflow: hidden;
        }

        body {
            position: relative;
            display: grid;
            grid-template-columns: 760px 1fr;
            padding: 28px;
            background:
                radial-gradient(circle at 1px 1px, rgba(80, 65, 42, 0.11) 1px, transparent 1.2px) 0 0 / 14px 14px,
                #f4efdf;
            color: #24211b;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 28px;
            border: 1px solid #b8aa8d;
            pointer-events: none;
        }

        main {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 66px 70px;
            border-right: 1px solid #b8aa8d;
        }

        main::after {
            content: "";
            position: absolute;
            top: 0;
            right: 28px;
            bottom: 0;
            width: 70px;
            border-inline: 1px solid rgba(117, 109, 92, 0.45);
            background: repeating-linear-gradient(90deg, rgba(112, 94, 62, 0.16) 0 6px, rgba(255,255,255,0.25) 6px 10px, transparent 10px 15px);
        }

        .eyebrow {
            width: max-content;
            margin: 0 0 32px;
            padding-bottom: 10px;
            border-bottom: 2px solid #a54f35;
            color: #813a27;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 620px;
            margin: 0;
            font-family: Iowan Old Style, Baskerville, "Times New Roman", serif;
            font-size: 90px;
            font-weight: 400;
            letter-spacing: -0.055em;
            line-height: 0.84;
        }

        h1 span {
            display: block;
            margin-top: 14px;
            color: #813a27;
            font-style: italic;
        }

        .subtitle {
            max-width: 555px;
            margin: 36px 0 0;
            padding-left: 22px;
            border-left: 3px solid #c45e3c;
            color: #5e594e;
            font-family: Iowan Old Style, Baskerville, "Times New Roman", serif;
            font-size: 24px;
            line-height: 1.4;
        }

        aside {
            position: relative;
            display: grid;
            grid-template-rows: 1fr auto;
            background: rgba(232, 223, 204, 0.72);
        }

        .promise {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 64px 54px 38px;
        }

        .promise strong {
            display: block;
            max-width: 300px;
            margin-bottom: 26px;
            font-family: Iowan Old Style, Baskerville, "Times New Roman", serif;
            font-size: 40px;
            font-weight: 400;
            letter-spacing: -0.035em;
            line-height: 1.03;
        }

        .promise p {
            max-width: 280px;
            margin: 0;
            color: #686155;
            font-size: 17px;
            line-height: 1.55;
        }

        .meta {
            min-height: 118px;
            padding: 27px 54px;
            border-top: 1px solid #b8aa8d;
            background: #24211b;
            color: #e8dfcc;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 13px;
            line-height: 1.8;
        }

        .meta b {
            color: #d2967f;
            font-weight: 700;
        }

        .author {
            position: absolute;
            right: 54px;
            bottom: 28px;
            color: #e8dfcc;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Claude Code · полный гайд</p>
        <h1>Собери своего <span>Джарвиса</span></h1>
        <p class="subtitle">Дашборд, голос, браузер, почта и автоматизация</p>
    </main>
    <aside>
        <div class="promise">
            <strong>Не скачивай.<br>Собери сам.</strong>
            <p>Честная схема без магии из роликов: одно подключение, один тест, одна проверка.</p>
        </div>
        <div class="meta"><b>10 частей</b> · готовые команды<br>Claude Code · MCP · routines</div>
        <div class="author">@buhaistrikalo</div>
    </aside>
</body>
</html>
